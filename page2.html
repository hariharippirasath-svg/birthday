<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Little Memories 🌻</title>

    <link rel="stylesheet" href="page2.css">

</head>

<body>

    <!-- SUNFLOWER PETALS -->
    <div class="petals" id="petals"></div>


    <!-- HEADER -->
    <header>

        <div class="logo">
            Thivya 🌻
        </div>

    </header>


    <main>


        <!-- ============================= -->
        <!-- MUSIC INSTRUCTION -->
        <!-- ============================= -->

        <div class="music-instruction"
             id="musicInstruction">

            <div class="music-icon">
                🎵
            </div>

            <h2>
                Oru song kekkalama? 🌻
            </h2>

            <p>
                Indha memory journey-ah full-ah enjoy panna...
                <br>
                first indha song-ah play pannu. ✨
            </p>

            <button id="musicButton">
                🎵 PLAY OUR SONG
            </button>

            <span>
                Headphones use panna innum nalla irukkum 🎧
            </span>

        </div>



        <!-- ============================= -->
        <!-- MEMORY JOURNEY -->
        <!-- ============================= -->

        <section class="journey">


            <p class="top-label">
                MEMORY JOURNEY
            </p>


            <h1>
                Oru photo...
                <br>
                oru memory... 🌻
            </h1>



            <!-- PHOTO -->
            <div class="photo-card">

                <img id="journeyImage"
                     src="images/thivya01.jpg"
                     alt="Thivya">

                <div class="photo-number"
                     id="photoNumber">

                    1 / 8

                </div>

            </div>



            <!-- QUOTE -->
            <p class="quote"
               id="quote">

                Sila moments-ku words thevaiye illa. 🌻

            </p>



            <!-- NEXT BUTTON -->
            <button class="next-button"
                    id="nextButton">

                Next Memory ✨

            </button>



            <!-- PROGRESS -->
            <div class="progress">

                <div class="progress-bar"
                     id="progressBar">

                </div>

            </div>



            <!-- FINAL MESSAGE -->
            <div class="final-message"
                 id="finalMessage">

                <p>
                    Innum neraya memories irukku...
                </p>

                <button onclick="goPage3()">

                    Continue to the Album 📸

                </button>

            </div>


        </section>

    </main>



    <!-- MUSIC -->

    <audio id="music"
           src="songs/rathinamo.MP3"
           loop>

    </audio>



    <!-- JAVASCRIPT -->

    <script src="page2.js"></script>

</body>

</html>
