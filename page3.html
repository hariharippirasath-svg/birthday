<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thivya's Album 📸</title>

    <link rel="stylesheet"
          href="page3.css">

</head>

<body>

    <header class="album-header">

        <p>MEMORIES</p>

        <h1>
            Little Moments 🌻
        </h1>

        <span>
            Oru album full of memories...
        </span>

    </header>


    <main>

        <div class="photo-grid"
             id="photoGrid">
        </div>


        <section class="continue">

            <p>
                Innum oru little surprise irukku... ✨
            </p>

            <button onclick="goPage4()">
                Meet the many sides of Thivya 👑
            </button>

        </section>

    </main>


    <!-- LIGHTBOX -->

    <div class="lightbox"
         id="lightbox">

        <button class="close"
                id="closeBtn">
            ✕
        </button>

        <button class="prev"
                id="prevBtn">
            ‹
        </button>

        <img id="lightboxImage"
             src=""
             alt="">

        <button class="next"
                id="nextBtn">
            ›
        </button>

        <div class="counter"
             id="counter">
        </div>

        <div class="lightbox-caption"
             id="lightboxCaption">
        </div>

    </div>


    <script src="page3.js"></script>

</body>
</html>
